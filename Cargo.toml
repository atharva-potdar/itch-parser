[package]
name = "itch-parser"
version = "0.3.0"
edition = "2024"

[dependencies]
mimalloc = "0.1.52"

[lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.profiling]
inherits = "release"
debug = true
strip = false
